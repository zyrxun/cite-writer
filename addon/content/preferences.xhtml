<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <checkbox id="__addonRef__-enable" data-l10n-id="pref-enable" />

  <hbox align="center">
    <label data-l10n-id="pref-style"></label>
    <menulist id="__addonRef__-style" flex="1">
      <menupopup />
    </menulist>
  </hbox>

  <label data-l10n-id="pref-trigger-mode"></label>
  <radiogroup id="__addonRef__-triggermode">
    <radio
      id="__addonRef__-trigger-auto"
      value="auto"
      data-l10n-id="pref-trigger-auto"
    />
    <radio
      id="__addonRef__-trigger-manual"
      value="manual"
      data-l10n-id="pref-trigger-manual"
    />
  </radiogroup>

  <hbox align="center">
    <label data-l10n-id="pref-min-score"></label>
    <html:input
      type="number"
      id="__addonRef__-minscore"
      min="0"
      step="0.5"
    ></html:input>
  </hbox>

  <label data-l10n-id="pref-scope"></label>
  <radiogroup id="__addonRef__-scope">
    <radio
      id="__addonRef__-scope-library"
      value="library"
      data-l10n-id="pref-scope-library"
    />
    <radio
      id="__addonRef__-scope-collection"
      value="collection"
      data-l10n-id="pref-scope-collection"
    />
  </radiogroup>
</groupbox>
